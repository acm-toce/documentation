# Keeps Templates/dist/*.zip in sync with Templates/latex/.
#
# The zips are what authors download from the TOCE author guidelines, so they are
# committed rather than built on demand. This workflow rebuilds them whenever the
# sources change, so the published download can never drift from the source in
# this repository.
name: Build JARS template zips

on:
  push:
    branches: [main]
    paths:
      - 'Templates/latex/**'
      - 'Templates/build.sh'
      - '.github/workflows/build-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild zips
        run: Templates/build.sh

      - name: Commit any changes
        run: |
          if git diff --quiet -- Templates/dist; then
            echo "Zips already match the sources; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Templates/dist
          git commit -m "Rebuild JARS template zips from Templates/latex"
          git push
